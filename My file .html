<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cosmic Dodge V2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#02030b;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:14px;left:0;width:100%;display:flex;justify-content:space-around;color:#fff;z-index:5;font-weight:bold;text-shadow:0 0 12px #7dd3fc;pointer-events:none}
#hud span{font-size:13px}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;background:rgba(1,2,10,.88)}
#over{display:none}
h1{font-size:38px;letter-spacing:7px;text-shadow:0 0 25px #60a5fa}
.sub{font-size:13px;opacity:.7;margin:12px 0 26px}
button{padding:15px 32px;border:0;border-radius:30px;background:#fff;color:#07111f;font-weight:bold;font-size:15px}
#pause{position:fixed;right:12px;top:48px;z-index:8;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;padding:9px 13px;border-radius:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span>🏆 <b id="score">0</b></span>
  <span>❤️ <b id="lives">3</b></span>
  <span>⚡ LV <b id="level">1</b></span>
</div>
<button id="pause">Ⅱ</button>

<div id="start" class="screen">
  <h1>COSMIC</h1>
  <div class="sub">DODGE • COLLECT • SURVIVE</div>
  <button id="startBtn">START MISSION 🚀</button>
</div>

<div id="over" class="screen">
  <h1>MISSION OVER</h1>
  <div class="sub" id="final">Score: 0</div>
  <button id="restartBtn">PLAY AGAIN</button>
</div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let W=innerWidth,H=innerHeight;
const player={x:W/2,y:H-100,targetX:W/2,size:17,inv:0};
let stars=[],enemies=[],coins=[],powerups=[],sparks=[],running=false,paused=false;
let score=0,lives=3,level=1,speed=3,et=0,ct=0,pt=0,last=0;

function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;player.y=H-100} resize();
addEventListener("resize",resize);

for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.5,s:.1+Math.random()*.5,t:Math.random()*6});

function move(px){player.targetX=Math.max(20,Math.min(W-20,px))}
c.addEventListener("pointerdown",e=>{if(running&&!paused)move(e.clientX)});
c.addEventListener("pointermove",e=>{if(running&&!paused)move(e.clientX)});

function reset(){
 score=0;lives=3;level=1;speed=3;et=ct=pt=0;
 enemies=[];coins=[];powerups=[];sparks=[];
 player.x=player.targetX=W/2;player.inv=0;paused=false;
}
function start(){reset();running=true;document.getElementById("start").style.display="none";document.getElementById("over").style.display="none";last=performance.now();requestAnimationFrame(loop)}
startBtn.onclick=start;restartBtn.onclick=start;
pause.onclick=()=>{if(running)paused=!paused};

function spawnEnemy(){
 const s=18+Math.random()*27;
 enemies.push({x:s+Math.random()*(W-s*2),y:-s,s,sp:speed+Math.random()*2,r:Math.random()*6,rs:(Math.random()-.5)*.08});
}
function spawnCoin(){coins.push({x:25+Math.random()*(W-50),y:-20,r:11,sp:speed*.8,p:Math.random()*6})}
function spawnPower(){powerups.push({x:25+Math.random()*(W-50),y:-25,r:13,sp:speed*.75,p:Math.random()*6})}
function burst(px,py,n=25){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,p=1+Math.random()*5;sparks.push({x:px,y:py,vx:Math.cos(a)*p,vy:Math.sin(a)*p,life:1,size:1+Math.random()*3})}
}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.size+b.r*.75}

function update(dt){
 player.x+=(player.targetX-player.x)*.17;
 if(player.inv>0)player.inv-=dt;
 level=Math.floor(score/15)+1; speed=3+level*.4;
 scoreEl.textContent=Math.floor(score); livesEl.textContent=lives; levelEl.textContent=level;

 et+=dt;ct+=dt;pt+=dt;
 if(et>Math.max(260,800-level*40)){spawnEnemy();et=0}
 if(ct>1050){spawnCoin();ct=0}
 if(pt>6500){spawnPower();pt=0}

 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];e.y+=e.sp*dt/16;e.r+=e.rs;
  if(player.inv<=0 && hit(player,e)){lives--;player.inv=1600;burst(player.x,player.y,35);enemies.splice(i,1);if(lives<=0)return endGame();continue}
  if(e.y>H+80){enemies.splice(i,1);score++}
 }
 for(let i=coins.length-1;i>=0;i--){
  let q=coins[i];q.y+=q.sp*dt/16;
  if(Math.hypot(player.x-q.x,player.y-q.y)<player.size+q.r+5){score+=5;burst(q.x,q.y,22);coins.splice(i,1)}
  else if(q.y>H+40)coins.splice(i,1);
 }
 for(let i=powerups.length-1;i>=0;i--){
  let q=powerups[i];q.y+=q.sp*dt/16;
  if(Math.hypot(player.x-q.x,player.y-q.y)<player.size+q.r+5){lives=Math.min(5,lives+1);burst(q.x,q.y,30);powerups.splice(i,1)}
  else if(q.y>H+40)powerups.splice(i,1);
 }
 for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.96;s.vy*=.96;s.life-=dt*.002;if(s.life<=0)sparks.splice(i,1)}
}

function space(t){
 x.fillStyle="#02030b";x.fillRect(0,0,W,H);
 for(const s of stars){s.y+=s.s;if(s.y>H)s.y=0;x.globalAlpha=Math.max(.12,s.a||.4+Math.sin(t*.002+s.t)*.3);x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1;
 let n=x.createRadialGradient(W*.18,H*.25,0,W*.18,H*.25,W*.7);n.addColorStop(0,"rgba(60,90,255,.12)");n.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=n;x.fillRect(0,0,W,H);
}

function earth(t){
 let R=Math.min(W*.5,285),ex=W*.72,ey=H*.57;
 let g=x.createRadialGradient(ex,ey,R*.5,ex,ey,R*1.45);g.addColorStop(0,"rgba(60,160,255,.25)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(ex,ey,R*1.4,0,7);x.fill();
 let o=x.createRadialGradient(ex-R*.35,ey-R*.4,5,ex,ey,R);o.addColorStop(0,"#65d7ff");o.addColorStop(.35,"#167bd2");o.addColorStop(.8,"#063b83");o.addColorStop(1,"#010f25");x.fillStyle=o;x.beginPath();x.arc(ex,ey,R,0,7);x.fill();
 x.save();x.beginPath();x.arc(ex,ey,R,0,7);x.clip();x.fillStyle="rgba(55,190,105,.78)";
 for(let i=0;i<13;i++){let a=i*2.4+t*.00008,px=ex+Math.cos(a)*R*.62,py=ey+Math.sin(i*3.2)*R*.55; x.beginPath();x.ellipse(px,py,R*(.06+((i*17)%8)/100),R*(.03+((i*13)%7)/100),i,0,7);x.fill()}
 x.strokeStyle="rgba(255,255,255,.16)";x.lineWidth=R*.035;
 for(let i=-2;i<4;i++){x.beginPath();x.ellipse(ex,ey+i*R*.23,R*.9,R*.18,-.2,0,7);x.stroke()}x.restore();
 x.strokeStyle="rgba(90,190,255,.7)";x.lineWidth=2;x.beginPath();x.arc(ex,ey,R,0,7);x.stroke();
}

function solar(t){
 let sx=W*.13,sy=H*.27;
 let g=x.createRadialGradient(sx,sy,3,sx,sy,90);g.addColorStop(0,"#fffbd0");g.addColorStop(.2,"#ffd54a");g.addColorStop(1,"rgba(255,100,0,0)");x.fillStyle=g;x.beginPath();x.arc(sx,sy,90,0,7);x.fill();
 x.fillStyle="#ffd83d";x.beginPath();x.arc(sx,sy,24,0,7);x.fill();
 [{r:52,s:4,col:"#aaa"},{r:76,s:6,col:"#d98b55"},{r:104,s:8,col:"#48a8ff"},{r:137,s:6,col:"#e66b4a"}].forEach((p,i)=>{x.strokeStyle="rgba(255,255,255,.07)";x.beginPath();x.arc(sx,sy,p.r,0,7);x.stroke();let a=t*.00045*(i+1)+i*1.7;x.fillStyle=p.col;x.beginPath();x.arc(sx+Math.cos(a)*p.r,sy+Math.sin(a)*p.r,p.s,0,7);x.fill()})
}

function drawPlayer(t){
 if(player.inv>0 && Math.floor(player.inv/100)%2===0)return;
 x.save();x.translate(player.x,player.y);
 let g=x.createRadialGradient(0,0,0,0,0,60);g.addColorStop(0,"rgba(90,220,255,.5)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(0,0,60,0,7);x.fill();
 x.beginPath();x.moveTo(0,-25);x.lineTo(18,18);x.lineTo(0,11);x.lineTo(-18,18);x.closePath();x.fillStyle="#effcff";x.fill();x.strokeStyle="#55d9ff";x.lineWidth=2;x.stroke();
 x.fillStyle="#65dfff";x.beginPath();x.moveTo(-7,17);x.lineTo(0,35+Math.random()*8);x.lineTo(7,17);x.fill();x.restore();
}
function drawObjects(t){
 for(const e of enemies){x.save();x.translate(e.x,e.y);x.rotate(e.r);x.shadowBlur=18;x.shadowColor="#ff405d";x.strokeStyle="#ff7182";x.lineWidth=2;x.strokeRect(-e.s,-e.s,e.s*2,e.s*2);x.restore()}
 for(const q of coins){let p=1+Math.sin(t*.008+q.p)*.15;let g=x.createRadialGradient(q.x,q.y,1,q.x,q.y,30);g.addColorStop(0,"rgba(255,230,40,.65)");g.addColorStop(1,"rgba(255,100,0,0)");x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,30,0,7);x.fill();x.beginPath();x.arc(q.x,q.y,q.r*p,0,7);x.fillStyle="#ffd21f";x.fill();x.strokeStyle="#fff3a0";x.stroke();x.fillStyle="#9b6200";x.font="bold 12px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("$",q.x,q.y)}
 for(const q of powerups){x.shadowBlur=18;x.shadowColor="#70e1ff";x.fillStyle="#45d7ff";x.beginPath();x.arc(q.x,q.y,q.r+Math.sin(t*.008+q.p)*2,0,7);x.fill();x.fillStyle="#fff";x.font="bold 13px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("+",q.x,q.y);x.shadowBlur=0}
}
function drawSparks(){for(const s of sparks){x.globalAlpha=Math.max(0,s.life);x.fillStyle="#ffe56b";x.beginPath();x.arc(s.x,s.y,s.size,0,7);x.fill()}x.globalAlpha=1}
function endGame(){running=false;final.textContent="Final Score: "+Math.floor(score);over.style.display="flex"}

const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),levelEl=document.getElementById("level");

function loop(t){
 if(!running)return;
 if(!paused){
  let dt=Math.min(40,t-last);last=t;update(dt);
  space(t);earth(t);solar(t);drawObjects(t);drawPlayer(t);drawSparks();
 }
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
